<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Messages</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { max-width: 900px; margin: auto; padding: 2rem 1rem; background: #111827; color: #f9fafb; }
    main { background: #1f2937; border-radius: 12px; padding: 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .card { border: 1px solid #374151; border-radius: 8px; padding: 1rem; }
    label { display: block; margin: .8rem 0 .35rem; font-weight: 600; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: .7rem; border-radius: 7px; border: 1px solid #4b5563; font: inherit; }
    input, textarea { background: #111827; color: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    button { margin-top: 1rem; background: #2563eb; color: white; border: 0; cursor: pointer; font-weight: 700; }
    button.secondary { background: #374151; }
    .hidden { display: none; }
    .small { color: #9ca3af; font-size: .9rem; }
    .status { min-height: 1.4em; color: #fbbf24; }
    .message { border-top: 1px solid #374151; padding: .8rem 0; }
    #messages { max-height: 460px; overflow-y: auto; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Private Messages</h1>
  <p class="small">Messages are encrypted in your browser before Supabase stores them.</p>

  <section id="auth">
    <div class="grid">
      <div class="card">
        <h2>Sign in</h2>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email">
        <label for="accountPassword">Account password</label>
        <input id="accountPassword" type="password" autocomplete="current-password">
        <button id="signIn">Sign in</button>
        <button id="signUp" class="secondary">Create account</button>
      </div>
      <div class="card">
        <h2>Encryption passphrase</h2>
        <p class="small">Share this passphrase with your friend separately. It is never sent to Supabase.</p>
        <label for="passphrase">Passphrase</label>
        <input id="passphrase" type="password" autocomplete="off">
      </div>
    </div>
  </section>

  <section id="app" class="hidden">
    <p id="account" class="small"></p>
    <div class="grid">
      <div class="card">
        <h2>Send message</h2>
        <label for="recipient">Friend's email</label>
        <input id="recipient" type="email" autocomplete="off">
        <label for="plain">Message</label>
        <textarea id="plain"></textarea>
        <button id="send">Encrypt and send</button>
      </div>
      <div class="card">
        <h2>Controls</h2>
        <button id="refresh" class="secondary">Refresh messages</button>
        <button id="signOut" class="secondary">Sign out</button>
      </div>
    </div>
    <div class="card">
      <h2>Live chat</h2>
      <div id="messages"></div>
    </div>
  </section>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>

<script>
'use strict';
const SUPABASE_URL = 'https://iozdwksqfhlhcrbhrwfl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LtMNYpBNgyymafFWbaRacg_6_vIgkcM';
const ITERATIONS = 600000;
const encoder = new TextEncoder();
const decoder = new TextDecoder();
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
let currentUser = null;
let realtimeChannel = null;

function status(message) { $('status').textContent = message; }
function b64(bytes) {
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}
function unb64(value) {
  const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
  const binary = atob(padded);
  return Uint8Array.from(binary, (char) => char.charCodeAt(0));
}
async function keyFor(secret, salt) {
  const material = await crypto.subtle.importKey('raw', encoder.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function encryptMessage(text, secret) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await keyFor(secret, salt);
  const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoder.encode(text)));
  const packet = new Uint8Array(31 + cipher.length);
  packet.set([80, 77, 3], 0);
  packet.set(salt, 3);
  packet.set(iv, 19);
  packet.set(cipher, 31);
  return `PM3.${b64(packet)}`;
}
async function decryptMessage(value, secret) {
  if (!value.startsWith('PM3.')) throw new Error('Unsupported message');
  const packet = unb64(value.slice(4));
  if (packet.length < 32 || packet[0] !== 80 || packet[1] !== 77 || packet[2] !== 3) throw new Error('Invalid message');
  const key = await keyFor(secret, packet.slice(3, 19));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: packet.slice(19, 31) }, key, packet.slice(31));
  return decoder.decode(plain);
}
function setSignedIn(visible) {
  $('auth').classList.toggle('hidden', visible);
  $('app').classList.toggle('hidden', !visible);
}
async function loadMessages() {
  const { data, error } = await db.from('messages')
    .select('id, created_at, sender_email, receiver_email, encrypted_text')
    .order('created_at', { ascending: true });
  if (error) throw error;
  const container = $('messages');
  container.replaceChildren();
  if (!data.length) { container.textContent = 'No messages yet.'; return; }
  for (const item of data) {
    const row = document.createElement('div');
    row.className = 'message';
    const meta = document.createElement('div');
    meta.className = 'small';
    meta.textContent = `${item.sender_email} → ${item.receiver_email} · ${new Date(item.created_at).toLocaleString()}`;
    const output = document.createElement('pre');
    output.textContent = '[Encrypted] Click decrypt.';
    const decrypt = document.createElement('button');
    decrypt.className = 'secondary';
    decrypt.textContent = 'Decrypt';
    decrypt.addEventListener('click', async () => {
      try { output.textContent = await decryptMessage(item.encrypted_text, $('passphrase').value); }
      catch { output.textContent = 'Wrong passphrase or damaged message.'; }
    });
    row.append(meta, output, decrypt);
    container.append(row);
  }
  container.lastElementChild?.scrollIntoView({ block: 'nearest' });
}
function subscribeToMessages() {
  if (realtimeChannel) db.removeChannel(realtimeChannel);
  realtimeChannel = db.channel(`messages-${currentUser.id}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async (payload) => {
      const message = payload.new;
      const email = currentUser.email.toLowerCase();
      if (message.sender_id === currentUser.id || message.receiver_email.toLowerCase() === email) {
        await loadMessages();
        status('New encrypted message received.');
      }
    })
    .subscribe((state) => {
      if (state === 'SUBSCRIBED') status('Live chat connected.');
      if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT') status('Live chat connection failed. Use Refresh.');
    });
}
async function refreshSession() {
  const { data } = await db.auth.getUser();
  currentUser = data.user;
  if (!currentUser) { setSignedIn(false); return; }
  $('account').textContent = `Signed in as ${currentUser.email}`;
  setSignedIn(true);
  await loadMessages();
  subscribeToMessages();
}
$('signIn').addEventListener('click', async () => {
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('accountPassword').value });
  if (error) { status(error.message); return; }
  status('Signed in.');
  await refreshSession();
});
$('signUp').addEventListener('click', async () => {
  const { data, error } = await db.auth.signUp({ email: $('email').value.trim(), password: $('accountPassword').value });
  if (error) { status(error.message); return; }
  status(data.session ? 'Account created and signed in.' : 'Account created. Check your email, then sign in.');
  if (data.session) await refreshSession();
});
$('send').addEventListener('click', async () => {
  const recipient = $('recipient').value.trim().toLowerCase();
  const text = $('plain').value;
  const secret = $('passphrase').value;
  if (!recipient || !text || !secret) { status('Enter recipient, message, and passphrase.'); return; }
  try {
    const encrypted = await encryptMessage(text, secret);
    const { error } = await db.from('messages').insert({
      sender_id: currentUser.id, sender_email: currentUser.email,
      receiver_email: recipient, encrypted_text: encrypted
    });
    $('plain').addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) $('send').click();
    });
    if (error) throw error;
    $('plain').value = '';
    status('Encrypted message sent.');
    await loadMessages();
  } catch (error) { status(error.message || 'Could not send message.'); }
});
$('refresh').addEventListener('click', async () => {
  try { await loadMessages(); status('Messages refreshed.'); }
  catch (error) { status(error.message); }
});
$('signOut').addEventListener('click', async () => {
  await db.auth.signOut();
  if (realtimeChannel) {
    await db.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
  currentUser = null;
  setSignedIn(false);
  status('Signed out.');
});
db.auth.onAuthStateChange(() => { refreshSession().catch((error) => status(error.message)); });
refreshSession().catch((error) => status(error.message));
</script>
</body>
</html>
