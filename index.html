<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Live Chat v2</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { max-width: 900px; margin: auto; padding: 2rem 1rem; background: #111827; color: #f9fafb; }
    main { background: #1f2937; border-radius: 12px; padding: 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .card { border: 1px solid #374151; border-radius: 8px; padding: 1rem; }
    label { display: block; margin: .8rem 0 .35rem; font-weight: 600; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: .7rem; border-radius: 7px; border: 1px solid #4b5563; font: inherit; }
    input, textarea { background: #111827; color: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    button { margin-top: 1rem; background: #2563eb; color: white; border: 0; cursor: pointer; font-weight: 700; }
    button.secondary { background: #374151; }
    .hidden { display: none; }
    nav { display: flex; gap: .5rem; margin-bottom: 1rem; }
    nav button { width: auto; margin: 0; }
    nav button.active { background: #16a34a; }
    .small { color: #9ca3af; font-size: .9rem; }
    .status { min-height: 1.4em; color: #fbbf24; }
    #messages { max-height: 460px; overflow-y: auto; }
    .message { border-top: 1px solid #374151; padding: .8rem 0; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Private Live Chat</h1>
  <p class="small">No account required. Messages are encrypted in your browser.</p>
  <nav>
    <button id="chatTab" class="active">Live Chat</button>
    <button id="classicTab" class="secondary">Classic Encryption</button>
  </nav>

  <section id="chatPage">
  <section id="rooms" class="grid">
    <div class="card">
      <h2>Create a room</h2>
      <label for="createName">Your name</label>
      <input id="createName" maxlength="40" autocomplete="nickname">
      <button id="createRoom">Create room</button>
    </div>
    <div class="card">
      <h2>Join a room</h2>
      <label for="joinCode">Room code</label>
      <input id="joinCode" maxlength="12" autocomplete="off">
      <label for="joinName">Your name</label>
      <input id="joinName" maxlength="40" autocomplete="nickname">
      <button id="joinRoom">Join room</button>
    </div>
  </section>
  </section>

  <section id="classicPage" class="hidden">
    <div class="grid">
      <div class="card">
        <h2>Encrypt</h2>
        <label for="classicPlain">Message</label>
        <textarea id="classicPlain"></textarea>
        <label for="classicPassphrase">Passphrase</label>
        <input id="classicPassphrase" type="password" autocomplete="off">
        <button id="classicEncrypt">Encrypt</button>
        <label for="classicOutput">Encrypted message</label>
        <textarea id="classicOutput" readonly spellcheck="false"></textarea>
        <button id="classicCopy" class="secondary">Copy encrypted message</button>
      </div>
      <div class="card">
        <h2>Decrypt</h2>
        <label for="classicInput">Encrypted message</label>
        <textarea id="classicInput" spellcheck="false"></textarea>
        <label for="classicDecryptPassphrase">Passphrase</label>
        <input id="classicDecryptPassphrase" type="password" autocomplete="off">
        <button id="classicDecrypt">Decrypt</button>
        <label for="classicDecrypted">Decrypted message</label>
        <textarea id="classicDecrypted" readonly></textarea>
      </div>
    </div>
  </section>

  <section id="chat" class="hidden">
    <p class="small">Room code: <strong id="roomCode"></strong> — share it with your friend.</p>
    <div class="grid">
      <div class="card">
        <label for="passphrase">Shared encryption passphrase</label>
        <input id="passphrase" type="password" autocomplete="off">
        <label for="plain">Message</label>
        <textarea id="plain"></textarea>
        <button id="send">Encrypt and send</button>
      </div>
      <div class="card">
        <p id="identity" class="small"></p>
        <button id="refresh" class="secondary">Refresh</button>
        <button id="leave" class="secondary">Leave room</button>
      </div>
    </div>
    <div class="card">
      <h2>Live chat</h2>
      <div id="messages"></div>
    </div>
  </section>
  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>
<script>
'use strict';
const SUPABASE_URL = 'https://iozdwksqfhlhcrbhrwfl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LtMNYpBNgyymafFWbaRacg_6_vIgkcM';
const ITERATIONS = 600000;
const encoder = new TextEncoder();
const decoder = new TextDecoder();
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
let roomCode = '';
let nickname = '';
let realtimeChannel = null;
let anonymousUser = null;

function status(message) { $('status').textContent = message; }
function randomCode() {
  const bytes = crypto.getRandomValues(new Uint8Array(6));
  return [...bytes].map((byte) => byte.toString(36).padStart(2, '0')).join('').slice(0, 10).toUpperCase();
}
function b64(bytes) {
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}
function unb64(value) {
  const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
  const binary = atob(padded);
  return Uint8Array.from(binary, (char) => char.charCodeAt(0));
}
async function keyFor(secret, salt) {
  const material = await crypto.subtle.importKey('raw', encoder.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptMessage(text, secret) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await keyFor(secret, salt);
  const cipher = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoder.encode(text)));
  const packet = new Uint8Array(31 + cipher.length);
  packet.set([80, 77, 3], 0); packet.set(salt, 3); packet.set(iv, 19); packet.set(cipher, 31);
  return `PM3.${b64(packet)}`;
}
async function decryptMessage(value, secret) {
  if (!value.startsWith('PM3.')) throw new Error('Unsupported message');
  const packet = unb64(value.slice(4));
  if (packet.length < 32 || packet[0] !== 80 || packet[1] !== 77 || packet[2] !== 3) throw new Error('Invalid message');
  const key = await keyFor(secret, packet.slice(3, 19));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: packet.slice(19, 31) }, key, packet.slice(31));
  return decoder.decode(plain);
}
function showPage(page) {
  const chat = page === 'chat';
  $('chatPage').classList.toggle('hidden', !chat);
  $('classicPage').classList.toggle('hidden', chat);
  $('chatTab').classList.toggle('active', chat);
  $('classicTab').classList.toggle('active', !chat);
}
async function ensureAnonymousSession() {
  const { data: sessionData } = await db.auth.getSession();
  if (sessionData.session?.user) {
    anonymousUser = sessionData.session.user;
    return;
  }
  const { data, error } = await db.auth.signInAnonymously();
  if (error) throw new Error('Guest access is not enabled in Supabase yet.');
  anonymousUser = data.user;
}
async function loadMessages() {
  const { data, error } = await db.from('messages').select('id, created_at, sender_email, encrypted_text')
    .eq('receiver_email', roomCode).order('created_at', { ascending: true });
  if (error) throw error;
  const container = $('messages');
  container.replaceChildren();
  if (!data.length) { container.textContent = 'No messages yet.'; return; }
  for (const item of data) {
    const row = document.createElement('div'); row.className = 'message';
    const meta = document.createElement('div'); meta.className = 'small';
    meta.textContent = `${item.sender_email} · ${new Date(item.created_at).toLocaleString()}`;
    const output = document.createElement('pre'); output.textContent = '[Encrypted] Click decrypt.';
    const decrypt = document.createElement('button'); decrypt.className = 'secondary'; decrypt.textContent = 'Decrypt';
    decrypt.addEventListener('click', async () => {
      try { output.textContent = await decryptMessage(item.encrypted_text, $('passphrase').value); }
      catch { output.textContent = 'Wrong passphrase or damaged message.'; }
    });
    row.append(meta, output, decrypt); container.append(row);
  }
  container.lastElementChild?.scrollIntoView({ block: 'nearest' });
}
function subscribe() {
  if (realtimeChannel) db.removeChannel(realtimeChannel);
  realtimeChannel = db.channel(`room-${roomCode}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `receiver_email=eq.${roomCode}` },
      async () => { await loadMessages(); status('New encrypted message received.'); })
    .subscribe((state) => { if (state === 'SUBSCRIBED') status('Live chat connected.'); });
}
async function enterRoom(code, name) {
  roomCode = code.toUpperCase().trim();
  nickname = name.trim();
  if (!/^[A-Z0-9]{6,12}$/.test(roomCode) || !nickname) { status('Enter a valid room code and name.'); return; }
  $('roomCode').textContent = roomCode; $('identity').textContent = `You are ${nickname}`;
  $('rooms').classList.add('hidden'); $('chat').classList.remove('hidden');
  try {
    await ensureAnonymousSession();
    await loadMessages();
    subscribe();
  } catch (error) {
    status(error.message);
  }
}
$('createRoom').addEventListener('click', () => enterRoom(randomCode(), $('createName').value));
$('joinRoom').addEventListener('click', () => enterRoom($('joinCode').value, $('joinName').value));
$('send').addEventListener('click', async () => {
  const text = $('plain').value; const secret = $('passphrase').value;
  if (!text || !secret) { status('Enter a message and passphrase.'); return; }
  try {
    const { error } = await db.from('messages').insert({
      sender_id: anonymousUser.id,
      sender_email: nickname,
      receiver_email: roomCode,
      encrypted_text: await encryptMessage(text, secret)
    });
    if (error) throw error;
    $('plain').value = ''; status('Encrypted message sent.'); await loadMessages();
  } catch (error) { status(error.message || 'Could not send message.'); }
});
$('plain').addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) $('send').click();
});
$('refresh').addEventListener('click', async () => { try { await loadMessages(); status('Refreshed.'); } catch (error) { status(error.message); } });
$('leave').addEventListener('click', async () => {
  if (realtimeChannel) await db.removeChannel(realtimeChannel);
  realtimeChannel = null; roomCode = ''; nickname = ''; $('messages').replaceChildren();
  $('chat').classList.add('hidden'); $('rooms').classList.remove('hidden'); status('Left room.');
});
$('chatTab').addEventListener('click', () => showPage('chat'));
$('classicTab').addEventListener('click', () => showPage('classic'));
$('classicEncrypt').addEventListener('click', async () => {
  const text = $('classicPlain').value;
  const secret = $('classicPassphrase').value;
  if (!text || !secret) { status('Enter a message and passphrase.'); return; }
  try {
    $('classicOutput').value = await encryptMessage(text, secret);
    status('Classic message encrypted.');
  } catch { status('Could not encrypt message.'); }
});
$('classicCopy').addEventListener('click', async () => {
  if (!$('classicOutput').value) { status('Encrypt a message first.'); return; }
  try {
    await navigator.clipboard.writeText($('classicOutput').value);
    status('Encrypted message copied.');
  } catch {
    $('classicOutput').select();
    status('Copy was blocked. Copy the selected text manually.');
  }
});
$('classicDecrypt').addEventListener('click', async () => {
  const value = $('classicInput').value.trim();
  const secret = $('classicDecryptPassphrase').value;
  if (!value || !secret) { status('Enter an encrypted message and passphrase.'); return; }
  try {
    $('classicDecrypted').value = await decryptMessage(value, secret);
    status('Classic message decrypted.');
  } catch {
    status('Could not decrypt. Check the message and passphrase.');
  }
});
</script>
</body>
</html>
